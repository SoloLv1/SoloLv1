<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋のおまじない</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eaf9ff, #d9edff);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      color: #526b7a;
      text-align: center;
    }

    .card {
      width: 85%;
      max-width: 500px;
      padding: 45px 25px;
      background: rgba(255,255,255,0.75);
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(80,120,150,0.15);
    }

    .moon {
      font-size: 42px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: normal;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    p {
      line-height: 2.2;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .name {
      margin-top: 35px;
      font-size: 17px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="moon">🌙</div>

    <h1>恋のおまじない</h1>

    <p>
      どうか今日も<br>
      あなたが笑っていますように。<br><br>

      遠くからでも<br>
      あなたの幸せを願えますように。<br><br>

      そしていつか<br>
      この想いがあなたに届きますように。
    </p>

    <div class="name">
      あたしの好きな推し、楠木そらくんへ🦈🌌
    </div>

  </div>

</body>
</html>
